name: Build UFC Oracle card
on:
  schedule:
    - cron: "17 13 * * *"      # every day
    - cron: "17 21 * * 5,6"    # extra run on fight weekends (Fri/Sat evening)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ufc
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the UFC Oracle model
        env:
          TOKEN: ${{ secrets.UFC_REPO_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/jaysantmyer-spec/fuzzy-happiness.git" ufc \
            || git clone --depth 1 https://github.com/jaysantmyer-spec/fuzzy-happiness.git ufc

      # Keep scraped fights and the trained model between runs so each run only
      # has to pull the newest events.
      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: |
            ufc/data
            ufc/models
          key: ufc-data-${{ github.run_id }}
          restore-keys: ufc-data-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ufc/requirements.txt

      - name: Install
        run: pip install pandas numpy scikit-learn scipy joblib requests beautifulsoup4 jinja2 certifi curl_cffi

      - name: Scrape new results and next card, then retrain
        id: cycle
        continue-on-error: true
        working-directory: ufc
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m ufc_predictor cycle

      - name: Backup - next card from ESPN
        id: espn
        continue-on-error: true
        working-directory: ufc
        run: python ../scripts/ufc_espn_card.py ../espn_debug.json

      - name: Build the card page
        working-directory: ufc
        run: |
          if ! python -m ufc_predictor report --out ../ufc.html --track 5; then
            echo "Saved model would not load here, retraining"
            python -m ufc_predictor train --preset fast
            python -m ufc_predictor report --out ../ufc.html --track 5
          fi
          STATUS="UFCStats ${{ steps.cycle.outcome }}, ESPN backup ${{ steps.espn.outcome }}"
          python ../scripts/ufc_finish.py ../ufc.html data/upcoming.csv "$STATUS"

      - name: Save data for next run
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ufc/data
            ufc/models
          key: ufc-data-${{ github.run_id }}

      - name: Keep test output (branch runs)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ufc-test
          path: |
            ufc.html
            espn_debug.json
            ufc/data/upcoming.csv

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ufc-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "UFC Oracle card update"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
